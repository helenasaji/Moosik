<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moosik Pro</title>
    <style>
        :root { color-scheme: dark; }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(98, 58, 162, 0.45), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(45, 172, 252, 0.35), transparent 40%);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(90deg, #b9935a, #e7c996);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        button {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: rgba(45, 172, 252, 0.35);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        audio {
            width: 100%;
            height: 44px;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .list-art {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: #1a1a24;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-info strong {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .save-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            background: rgba(45, 172, 252, 0.25);
            border: 1px solid rgba(45, 172, 252, 0.4);
            flex-shrink: 0;
        }

        .remove-btn {
            padding: 6px 10px;
            font-size: 0.75rem;
            background: rgba(255, 60, 60, 0.2);
            border: 1px solid rgba(255, 60, 60, 0.4);
            flex-shrink: 0;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: Name Gate -->
    <div id="welcomeScreen" class="glass-panel">
        <h1>Welcome to Moosik</h1>
        <p style="text-align: center; color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: -8px; margin-bottom: 18px;">
            Enter your name to load your personalized player
        </p>
        <div class="search-container">
            <input type="text" id="userNameInput" placeholder="Enter your full name...">
            <button type="button" id="enterAppBtn">Enter</button>
        </div>
    </div>

    <!-- SCREEN 2: Main Player -->
    <div id="mainApp" class="glass-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h1 id="greetingText" style="margin: 0; font-size: 1.5rem; text-align: left;">Moosik</h1>
            <button type="button" id="switchUserBtn" style="padding: 6px 12px; font-size: 0.75rem; background: rgba(255,255,255,0.1);">Switch User</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search track or artist...">
            <button type="button" id="searchBtn">Find</button>
        </div>

        <audio id="audioPlayer" controls></audio>

        <div id="resultsList" class="results-container"></div>

        <div class="favorites-section">
            <h2 style="font-size: 1.1rem; margin: 24px 0 12px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px;">❤ My Favorites</h2>
            <div id="favoritesList" class="results-container"></div>
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainApp = document.getElementById('mainApp');
        const userNameInput = document.getElementById('userNameInput');
        const enterAppBtn = document.getElementById('enterAppBtn');
        const switchUserBtn = document.getElementById('switchUserBtn');
        const greetingText = document.getElementById('greetingText');

        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const favoritesList = document.getElementById('favoritesList');
        const audioPlayer = document.getElementById('audioPlayer');

        let currentUser = "";

        // Check for active session
        const savedUser = localStorage.getItem('moosik_active_user');
        if (savedUser) {
            loginUser(savedUser);
        }

        enterAppBtn.addEventListener('click', handleLogin);
        userNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        function handleLogin() {
            const nameTyped = userNameInput.value.trim();
            if (nameTyped) {
                localStorage.setItem('moosik_active_user', nameTyped);
                loginUser(nameTyped);
            }
        }

        switchUserBtn.addEventListener('click', () => {
            localStorage.removeItem('moosik_active_user');
            currentUser = "";
            audioPlayer.pause();
            audioPlayer.src = "";
            mainApp.style.display = "none";
            welcomeScreen.style.display = "block";
            userNameInput.value = "";
        });

        function loginUser(name) {
            currentUser = name;
            welcomeScreen.style.display = "none";
            mainApp.style.display = "block";
            greetingText.textContent = `${name}'s Moosik`;
            renderFavorites();
        }

        // Audius Search
        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsList.innerHTML = `<div class="status-msg">Searching Audius...</div>`;

            try {
                const hostRes = await fetch('https://api.audius.co');
                const hosts = await hostRes.json();
                const host = hosts.data[0];

                const res = await fetch(`${host}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=Moosik`);
                const data = await res.json();

                resultsList.innerHTML = "";

                if (data.data && data.data.length > 0) {
                    data.data.slice(0, 5).forEach(track => {
                        const artwork = track.artwork && track.artwork['150x150'] 
                            ? track.artwork['150x150'] 
                            : 'https://via.placeholder.com/150/1a1a24/ffffff?text=Moosik';
                        const streamUrl = `${host}/v1/tracks/${track.id}/stream?app_name=Moosik`;

                        const trackDiv = document.createElement('div');
                        trackDiv.className = 'track-item';
                        trackDiv.innerHTML = `
                            <img src="${artwork}" alt="Cover" class="list-art">
                            <div class="track-info" style="flex: 1;">
                                <strong>${escapeHtml(track.title)}</strong>
                                <span>${escapeHtml(track.user.name)}</span>
                            </div>
                            <button type="button" class="save-btn">Save</button>
                        `;

                        trackDiv.querySelector('.list-art').addEventListener('click', () => playSong(streamUrl));
                        trackDiv.querySelector('.track-info').addEventListener('click', () => playSong(streamUrl));

                        trackDiv.querySelector('.save-btn').addEventListener('click', (e) => {
                            e.stopPropagation();
                            saveFavorite({
                                id: track.id,
                                title: track.title,
                                artist: track.user.name,
                                artwork,
                                streamUrl
                            });
                        });

                        resultsList.appendChild(trackDiv);
                    });
                } else {
                    resultsList.innerHTML = `<div class="status-msg">No tracks found. Try another query.</div>`;
                }
            } catch (err) {
                resultsList.innerHTML = `<div class="status-msg">Error connecting to network. Try again.</div>`;
            }
        }

        function playSong(url) {
            audioPlayer.src = url;
            audioPlayer.play().catch(() => {});
        }

        // Favorites DB
        function getUserFavorites() {
            const masterDB = JSON.parse(localStorage.getItem('moosik_master_db')) || {};
            return masterDB[currentUser] || [];
        }

        function saveFavorite(songData) {
            const masterDB = JSON.parse(localStorage.getItem('moosik_master_db')) || {};
            if (!masterDB[currentUser]) {
                masterDB[currentUser] = [];
            }

            const exists = masterDB[currentUser].some(fav => fav.id === songData.id);
            if (!exists) {
                masterDB[currentUser].push(songData);
                localStorage.setItem('moosik_master_db', JSON.stringify(masterDB));
                renderFavorites();
            }
        }

        function renderFavorites() {
            favoritesList.innerHTML = "";
            const userFavorites = getUserFavorites();

            if (userFavorites.length === 0) {
                favoritesList.innerHTML = `<div class="status-msg">No favorites yet. Search and save songs above.</div>`;
                return;
            }

            userFavorites.forEach((fav, index) => {
                const favDiv = document.createElement('div');
                favDiv.className = 'track-item';
                favDiv.innerHTML = `
                    <img src="${fav.artwork}" alt="Cover" class="list-art">
                    <div class="track-info" style="flex: 1;">
                        <strong>${escapeHtml(fav.title)}</strong>
                        <span>${escapeHtml(fav.artist)}</span>
                    </div>
                    <button type="button" class="remove-btn">✕</button>
                `;

                favDiv.querySelector('.list-art').addEventListener('click', () => playSong(fav.streamUrl));
                favDiv.querySelector('.track-info').addEventListener('click', () => playSong(fav.streamUrl));

                favDiv.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const masterDB = JSON.parse(localStorage.getItem('moosik_master_db')) || {};
                    if (masterDB[currentUser]) {
                        masterDB[currentUser].splice(index, 1);
                        localStorage.setItem('moosik_master_db', JSON.stringify(masterDB));
                        renderFavorites();
                    }
                });

                favoritesList.appendChild(favDiv);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
