<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moosik Pro</title>
    <!-- Correct ESM browser import for Supabase v2 -->
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        window.supabase = { createClient };
    </script>
    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>
    <!-- SCREEN 1: Name Gate -->
    <div id="welcomeScreen" class="glass-panel">
        <h1>Welcome to Moosik</h1>
        <p style="text-align: center; color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: -8px; margin-bottom: 18px;">
            Enter your name to load your personalized player
        </p>
        <div class="search-container">
            <input type="text" id="userNameInput" placeholder="Enter your full name...">
            <button type="button" id="enterAppBtn">Enter</button>
        </div>
    </div>

    <!-- SCREEN 2: Main Player -->
    <div id="mainApp" class="glass-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h1 id="greetingText" style="margin: 0; font-size: 1.5rem; text-align: left;">Moosik</h1>
            <button type="button" id="switchUserBtn" style="padding: 6px 12px; font-size: 0.75rem; background: rgba(255,255,255,0.1);">Switch User</button>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search track or artist...">
            <button type="button" id="searchBtn">Find</button>
        </div>
        <audio id="audioPlayer" controls></audio>
        <div id="resultsList" class="results-container"></div>
        <div class="favorites-section">
            <h2 style="font-size: 1.1rem; margin: 24px 0 12px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px;">❤ My Favorites</h2>
            <div id="favoritesList" class="results-container"></div>
        </div>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
