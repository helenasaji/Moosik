<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moosik</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- External APIs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    
    <!-- 1. The Hanging Bulb Theme Toggle (Hangs outside the panels) -->
    <div class="hanging-bulb-container" id="themeBulb" aria-label="Toggle Theme">
        <div class="wire"></div>
        <div class="bulb-base"></div>
        <div class="bulb"></div>
    </div>

    <!-- 2. Welcome Screen -->
    <div id="welcomeScreen" class="glass-panel">
        <h1 style="text-align: center;">Welcome to Moosik</h1>
        <div class="search-container">
            <input type="text" id="userNameInput" placeholder="Enter your name to begin">
            <button id="enterAppBtn">Enter</button>
        </div>
    </div>

    <!-- 3. Main App Screen -->
    <div id="mainApp" class="glass-panel" style="display: none;">
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h1 style="margin: 0;" id="greetingText">Moosik</h1>
            <button id="switchUserBtn">Switch User</button>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search songs, artists, Malayalam...">
            <button id="searchBtn">Search</button>
        </div>

        <!-- YouTube Player -->
        <div id="playerContainer" style="display: none;"></div>

        <!-- Search Results -->
        <div id="resultsList" class="results-container"></div>
        
        <!-- Favorites Section -->
        <h2 style="margin-top: 24px; margin-bottom: 12px; font-size: 1.2rem; color: var(--text-primary);">My Favorites</h2>
        <div id="favoritesList" class="results-container"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
